runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0

env:
  - variable: GMAIL_CLIENT_ID
    secret: GMAIL_CLIENT_ID
  - variable: GMAIL_CLIENT_SECRET
    secret: GMAIL_CLIENT_SECRET
  - variable: GMAIL_REDIRECT_URI
    secret: GMAIL_REDIRECT_URI
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
