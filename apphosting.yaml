runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0

env:
  - variable: GMAIL_CLIENT_ID
    secret: GMAIL_CLIENT_ID
  - variable: GMAIL_CLIENT_SECRET
    secret: GMAIL_CLIENT_SECRET
  - variable: GMAIL_REDIRECT_URI
    secret: GMAIL_REDIRECT_URI
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
  - variable: GOOGLE_ADS_DEVELOPER_TOKEN
    secret: GOOGLE_ADS_DEVELOPER_TOKEN
  - variable: GOOGLE_ADS_LOGIN_CUSTOMER_ID
    secret: GOOGLE_ADS_LOGIN_CUSTOMER_ID
  - variable: GOOGLE_ADS_REDIRECT_URI
    secret: GOOGLE_ADS_REDIRECT_URI
  - variable: GA4_CLIENT_EMAIL
    secret: GA4_CLIENT_EMAIL
  - variable: GA4_PRIVATE_KEY
    secret: GA4_PRIVATE_KEY
  - variable: GA4_PROPERTY_ID
    secret: GA4_PROPERTY_ID
  - variable: GSC_SITE_URL
    secret: GSC_SITE_URL
